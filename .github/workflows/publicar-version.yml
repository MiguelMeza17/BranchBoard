# Publica una versión nueva de BranchBoard cuando se sube una etiqueta vX.Y.Z.
# Compila el instalador de Windows, lo firma con la llave de actualizaciones y
# crea la Release con el instalador y `latest.json` (lo que consulta la app
# desde Ajustes → "Actualizar versión").
name: Publicar versión

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/backend

      - name: Instalar dependencias del frontend
        working-directory: app/frontend
        run: npm ci

      - name: Compilar y firmar el instalador
        working-directory: app/frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri build

      - name: Armar latest.json
        shell: bash
        run: node app/backend/scripts/latest-json.mjs "$GITHUB_REF_NAME" app/backend/target/release/bundle/nsis

      - name: Crear la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app/backend/target/release/bundle/nsis
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "BranchBoard ${GITHUB_REF_NAME#v}" --generate-notes ./*-setup.exe ./*-setup.exe.sig latest.json
