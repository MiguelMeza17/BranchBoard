[package]
name = "branchboard"
version = "0.1.0"
description = "BranchBoard: gestión de tareas sobre Unity Version Control"
edition = "2021"
rust-version = "1.77"

[lib]
name = "branchboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
